
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>Halaman Utama - Portofolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe0ec, #f8b8d0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 650px;
            padding: 45px 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(150, 60, 100, 0.15);
        }

        h1 {
            color: #c04b7c;
            margin-bottom: 12px;
            font-size: 32px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .menu a {
            text-decoration: none;
            background: #e982aa;
            color: white;
            padding: 18px;
            border-radius: 15px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s;
        }

        .menu a:hover {
            background: #c94f80;
            transform: translateY(-4px);
        }

        footer {
            margin-top: 35px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>
